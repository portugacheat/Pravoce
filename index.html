<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Aniversário</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('https://musicaDela.b-cdn.net/images%20(82).jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: grayscale(100%);
            -webkit-filter: grayscale(100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            color: #ffffff;
        }

        /* Camada para contraste do texto */
        .overlay-escura {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.28);
            z-index: 1;
        }

        /* Player Estilo Spotify no Topo */
        .spotify-top-player {
            position: absolute;
            top: 25px;
            z-index: 20;
            background: rgba(18, 18, 18, 0.45);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 12px 25px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: auto;
            min-width: 320px;
            justify-content: space-between;
            animation: fadeInTop 1.2s ease-out;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-control {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-control:hover {
            transform: scale(1.15);
            color: #d4af37;
        }

        .btn-play {
            color: #d4af37;
            font-size: 1.8rem;
        }

        .track-info-mini {
            font-size: 0.7rem;
            color: #d4af37;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-weight: 500;
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Card Central de Frases */
        .card-frases {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 440px;
            width: 85%;
            background: transparent;
            backdrop-filter: blur(5px);
            padding: 20px;
            border-radius: 20px;
            animation: carregarCard 1.5s ease-out;
        }

        .tag-data {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: #d4af37;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: -0.02em;
            margin-bottom: 25px;
            color: #ffffff;
        }

        .container-texto {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        p {
            color: #ffffff;
            font-size: 1rem;
            line-height: 1.7;
            font-weight: 400;
            text-shadow: 2px 2px 15px rgba(0, 0, 0, 0.9);
            transition: opacity 0.4s ease;
        }

        /* Botão Moderno */
        .btn-acao {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 24px;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-acao:hover {
            border-color: #d4af37;
            color: #d4af37;
            background: rgba(0, 0, 0, 0.2);
        }

        /* Rodapé com o nome dela */
        .footer-assinatura {
            position: absolute;
            bottom: 30px;
            z-index: 15;
            font-size: 0.75rem;
            color: #d4af37;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-shadow: 1px 1px 10px rgba(0, 0, 0, 0.5);
            animation: fadeInBottom 2s ease-in;
        }

        @keyframes carregarCard {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInTop {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInBottom {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .particula {
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            pointer-events: none;
            animation: flutuar linear infinite;
            z-index: 2;
        }

        @keyframes flutuar {
            0% { transform: translateY(105vh); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-5vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="overlay-escura"></div>

    <div class="spotify-top-player">
        <div class="player-controls">
            <button class="btn-control" onclick="voltarMusica()">⏮</button>
            <button class="btn-control btn-play" id="play-icon" onclick="togglePlayer()">▶</button>
            <button class="btn-control" onclick="proximaMusica()">⏭</button>
        </div>
        <div class="track-info-mini" id="status-track">Carregando...</div>
    </div>

    <div class="card-frases">
        <div class="tag-data">Domingo, 17 de Maio</div>
        <h1>Parabéns.</h1>
        
        <div class="container-texto">
            <p id="frase-exibida">Cruzamos caminhos há apenas três dias, mas datas especiais merecem ser lembradas. Feliz aniversário Clarisse, você tem uma energia linda.</p>
        </div>

        <button class="btn-acao" onclick="proximaFrase()">Descobrir nova mensagem</button>
    </div>

    <div class="footer-assinatura">Pra você 🫵🏼 Clarisse</div>

    <audio id="player-audio"></audio>

    <script>
        const audio = document.getElementById('player-audio');
        const playIcon = document.getElementById('play-icon');
        const statusTrack = document.getElementById('status-track');
        const fraseExibida = document.getElementById('frase-exibida');

        // Playlist com caminhos corrigidos
        const playlist = [
            { nome: "Bem - Chapéu de Palha", url: "https://musicaDela.b-cdn.net/Chap%C3%A9u%20de%20Palha%20-%20Bem(M4A_128K).m4a" },
            { nome: "Star - Colde", url: "https://musicaDela.b-cdn.net/Colde%20(%EC%BD%9C%EB%93%9C)%20-%20Star%20(Lyrics)(M4A_128K).m4a" },
            { nome: "Buzz Lightyear - Choice x Azzy", url: "https://musicaDela.b-cdn.net/Choice%20_%20Azzy%20-%20Buzz%20Lightyear(M4A_128K).m4a" },
            { nome: "Paraíso - Ananda", url: "https://musicaDela.b-cdn.net/Ananda%20-%20Para%C3%ADso%20(Official%20Music%20Video)(M4A_128K).m4a" },
            { nome: "No Escuro - Ana Gabriela ft. Anavitória", url: "https://musicaDela.b-cdn.net/Ana%20Gabriela_%20_anavitoria%20%20-%20No%20Escuro(M4A_128K).m4a" },
            { nome: "Pés no chão", url: "https://musicaDela.b-cdn.net/P%C3%A9s%20no%20ch%C3%A3o(M4A_128K).m4a" },
            { nome: "The Abyss - The Weeknd ft. Lana Del Rey", url: "https://musicaDela.b-cdn.net/the%20abyss%20-%20the%20weeknd%20feat.%20lana%20del%20rey%20%5BTRADU%C3%87%C3%83O_LEGENDADO%5D(M4A_128K).m4a" },
            { nome: "Você", url: "https://musicaDela.b-cdn.net/Voc%C3%AA(M4A_128K).m4a" }
        ];

        let indexMusica = 0;

        function carregarMusica(index) {
            indexMusica = index;
            audio.src = playlist[indexMusica].url;
            statusTrack.innerText = playlist[indexMusica].nome;
        }
        
        carregarMusica(0);

        function atualizarInterface() {
            if (audio.paused) {
                playIcon.innerText = "▶";
            } else {
                playIcon.innerText = "⏸";
                statusTrack.innerText = playlist[indexMusica].nome;
            }
        }

        function togglePlayer() {
            if (audio.paused) {
                audio.play().then(atualizarInterface);
            } else {
                audio.pause();
                atualizarInterface();
            }
        }

        function proximaMusica() {
            indexMusica = (indexMusica + 1) % playlist.length;
            carregarMusica(indexMusica);
            audio.play().then(atualizarInterface);
        }

        function voltarMusica() {
            if (audio.currentTime > 3) {
                audio.currentTime = 0;
            } else {
                indexMusica = (indexMusica - 1 + playlist.length) % playlist.length;
                carregarMusica(indexMusica);
            }
            audio.play().then(atualizarInterface);
        }

        audio.addEventListener('ended', proximaMusica);

        // Banco de dados com as outras 29 frases fofas para rodar no sorteio
        const frasesSorteio = [
            "Há quem precise de anos para se fazer notar, e há você, que mudou o tom da minha semana em apenas três conversas. Parabéns!",
            "O tempo é só um detalhe quando a sintonia é verdadeira. Que o dia de hoje seja o início de um ano incrível para você, Clarisse.",
            "Às vezes, os melhores encontros da vida acontecem sem aviso. Que bom ter conhecido você a tempo de celebrar o seu dia.",
            "Que a vida te surpreenda hoje com motivos lindos para sorrir. Parabéns Clarisse, por ser alguém tão singular.",
            "Aniversários são recomeços. Desejo que o seu novo ciclo seja doce, leve e cheio de instantes que façam seu coração vibrar.",
            "Três dias podem parecer pouco no calendário, mas foram suficientes para perceber o quanto o seu sorriso é contagiante.",
            "Celebrar você hoje é lembrar que o mundo guarda encontros incríveis. Que seu dia seja tão genuíno e iluminado quanto você.",
            "Desejo que o seu novo ano traga histórias profundas, risos fáceis e toda a felicidade que cabe no seu coração. Parabéns!",
            "Para hoje, conexões bonitas, abraços quentinhos e a certeza de que você é alguém muito especial. Feliz aniversário.",
            "Dizem que coisas boas acontecem de repente, e conhecer você há três dias foi a prova disso. Parabéns pelo seu dia, Clarisse!",
            "Seu aniversário chegou logo depois de te conhecer, e isso me deu o pretexto perfeito para te lembrar o quanto você é cativante.",
            "Que hoje chova carinho e boas energias sobre você, Clarisse. Parabéns por ser essa presença tão leve e bonita.",
            "Nem todo mundo tem o dom de iluminar um lugar apenas conversando, mas você faz parecer fácil. Um aniversário maravilhoso para você!",
            "Que o universo te devolva em dobro toda a vibe positiva e fofa que você transmite. Feliz novo ciclo!",
            "Três dias conhecendo você e eu já sei que o mundo é um lugar bem mais interessante com o seu brilho. Parabéns, Clarisse!",
            "Espero que a música de hoje embale um dia lindo e cheio de paz para você. Você merece todas as coisas fofas da vida.",
            "Sua existência merece ser celebrada em grande estilo. Que esse aniversário seja o início de uma fase mágica na sua vida.",
            "Você apareceu há pouco tempo, mas já deixou claro o quanto merece ser cercada de muito amor e mimos hoje. Feliz aniversário!",
            "Que o seu dia seja repleto de sorrisos bobos, mensagens bonitas e aquela sensação gostosa de ser amada. Parabéns, Clarisse.",
            "Não importa há quanto tempo nos conhecemos, mas sim o quão especial é poder te desejar um feliz aniversário hoje. Aproveite muito!",
            "Que o dia de hoje seja tão doce quanto a sua presença. Parabéns pelo seu aniversário, Clarisse!",
            "Desejo que você nunca perca essa essência fofa e esse brilho nos olhos que encantam qualquer um. Um dia lindo para você.",
            "Parabéns! Que este novo ano de vida venha recheado de paz, saúde, conquistas e risadas que fiquem salvas na memória.",
            "Existem pessoas que são como músicas boas: a gente conhece há pouco tempo, mas já quer ouvir sempre. Feliz aniversário, Clarisse!",
            "Passando para te lembrar que você é preciosa e que torço muito para que o seu dia seja simplesmente perfeito.",
            "Que a felicidade não seja apenas um momento hoje, mas o resumo de todo o seu novo ano. Parabéns por ser quem você é.",
            "Em apenas três dias deu para notar que você merece o mundo inteiro de coisas boas. Um aniversário incrível!",
            "Que a vida seja generosa com os seus sonhos. Parabéns, Clarisse! Que o seu dia transborde alegria.",
            "A vida fica mais bonita quando encontramos pessoas com o coração tão bom quanto o seu. Um feliz e fofo aniversário!"
        ];

        // Rastreia apenas as frases do sorteio que ela já viu
        function obterFraseInedita() {
            let vistas = JSON.parse(localStorage.getItem('vistas_aleatorias')) || [];
            let disponiveis = frasesSorteio.filter(f => !vistas.includes(f));

            // Se ela já leu todas as frases extras, limpa a memória para recomeçar o sorteio
            if (disponiveis.length === 0) {
                vistas = [];
                disponiveis = [...frasesSorteio];
            }

            const escolhida = disponiveis[Math.floor(Math.random() * disponiveis.length)];
            vistas.push(escolhida);
            localStorage.setItem('vistas_aleatorias', JSON.stringify(vistas));
            return escolhida;
        }

        // Função do botão que gera as novas frases com efeito suave
        function proximaFrase() {
            fraseExibida.style.opacity = 0;
            setTimeout(() => {
                fraseExibida.innerText = obterFraseInedita();
                fraseExibida.style.opacity = 1;
            }, 400);
        }

        function criarParticula() {
            const p = document.createElement('div');
            p.className = 'particula';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.width = p.style.height = (Math.random() * 3 + 1) + 'px';
            p.style.animationDuration = (Math.random() * 5 + 5) + 's';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 10000);
        }
        setInterval(criarParticula, 800);
    </script>
</body>
</html>
